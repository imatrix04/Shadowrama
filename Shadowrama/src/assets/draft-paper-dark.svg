<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.84  0 0 0 0 0.66  0 0 0 0.35 -0.1"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e6d5a8" stroke-opacity="0.06" stroke-width="0.7"/>
    </pattern>
    <pattern id="grid5" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#e6d5a8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.4"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#grid5)"/>
</svg>
